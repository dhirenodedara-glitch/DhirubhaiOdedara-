kind = "mobile"
previewPath = "/vibeup/"
title = "VibeUp"
description = "A supportive AI life and social coach for young adults, with personalised onboarding, daily glow-up habits, conversation practice, challenges, progress tracking, and privacy-first profile settings."
version = "1.0.0"
id = "artifacts/vibeup"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/vibeup/" ]
localPort = 20560

[services.development]
run = "pnpm --filter @workspace/vibeup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vibeup", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vibeup", "run", "serve" ]

[services.env]
PORT = "20560"
BASE_PATH = "/vibeup/"
